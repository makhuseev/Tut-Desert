<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админ-панель — Tut Dessert</title><link rel="stylesheet" href="styles.css">
<style>
.admin-wrap{max-width:1180px;margin:55px auto;padding:0 25px}.admin-card{background:#fff;border:1px solid #eadfd4;border-radius:20px;padding:24px;margin:22px 0}.login-card{max-width:480px}.admin-table{background:#fff;border:1px solid #eadfd4;border-radius:20px;overflow:auto}.admin-row{display:grid;grid-template-columns:92px 145px 1.35fr .75fr 130px 170px 105px;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid #eee2d7;min-width:1050px}.admin-head{font-weight:700;background:#f3e7d8}.admin-actions{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.field{display:block;margin:14px 0}.field span{display:block;font-size:13px;margin-bottom:7px;color:#765f51}.field input{width:100%;padding:12px;border:1px solid #dfcbb8;border-radius:10px;box-sizing:border-box;background:#fffaf4}.notice{padding:17px 20px;border-radius:15px;background:#fff0d9;color:#76563d;line-height:1.6;margin:22px 0}.small{font-size:12px;color:#8b7669}.status{margin:14px 0;padding:12px 15px;border-radius:12px;background:#f4eee8;color:#76563d}.status.success{background:#eaf6ec;color:#2f6b3b}.status.error{background:#fdeaea;color:#9a3333}.hidden{display:none!important}.topline{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.switch{display:flex;align-items:center;gap:7px;font-size:13px}.product-image-cell{display:flex;flex-direction:column;gap:7px;align-items:flex-start}.product-preview{width:92px;height:76px;border:1px solid #dfcbb8;border-radius:12px;background:#fffaf4;display:grid;place-items:center;overflow:hidden;font-size:32px}.product-preview img{width:100%;height:100%;object-fit:cover}.upload-btn,.remove-image{display:inline-flex;align-items:center;justify-content:center;border:1px solid #dfcbb8;border-radius:9px;padding:7px 9px;background:#fffaf4;color:#76563d;font-size:11px;cursor:pointer}.upload-btn input{display:none}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}@media(max-width:700px){.admin-wrap{margin:25px auto;padding:0 15px}.admin-row{grid-template-columns:1fr 1fr;min-width:0}.admin-head{display:none}.settings-grid{grid-template-columns:1fr}}
</style></head>
<body>
<header class="site-header"><a class="logo" href="index.html">Tut <em>Dessert</em></a><a href="index.html">← На сайт</a></header>
<main class="admin-wrap"><p class="eyebrow">Управление каталогом</p><h1>Админ-панель</h1>
<div id="configWarning" class="notice hidden"><b>Не удалось подключить Supabase.</b><br>Проверь подключение Supabase.</div>
<div id="loginCard" class="admin-card login-card hidden"><h2>Вход администратора</h2><label class="field"><span>Email</span><input id="email" type="email"></label><label class="field"><span>Пароль</span><input id="password" type="password"></label><button class="btn primary" id="login">Войти</button></div>
<div id="adminCard" class="hidden"><div class="admin-card"><div class="topline"><div><b>Вы вошли как:</b> <span id="adminEmail"></span></div><button class="btn secondary" id="logout">Выйти</button></div><div class="notice"><b>Можно:</b> менять цены, названия, статус и фотографии.</div><div id="status" class="status">Готово.</div><div class="admin-actions"><button class="btn primary" id="save">Сохранить изменения</button><button class="btn secondary" id="seed">Загрузить исходный каталог</button></div></div>
<div class="admin-card"><h2>Настройки сайта</h2><div class="settings-grid"><label class="field"><span>Адрес</span><input id="address"></label><label class="field"><span>Телефон</span><input id="phone"></label><label class="field"><span>WhatsApp</span><input id="whatsapp"></label><label class="field"><span>Часы работы</span><input id="hours"></label><label class="field"><span>2GIS</span><input id="map_url"></label><label class="field"><span>Instagram</span><input id="instagram_url"></label><label class="field"><span>Логотип</span><input id="logo_url"></label></div><button class="btn primary" id="saveSettings">Сохранить настройки сайта</button></div>
<div class="admin-table"><div class="admin-row admin-head"><div>Фото</div><div>ID</div><div>Товар</div><div>Категория</div><div>Цена</div><div>Цена / размеры</div><div>Статус</div></div><div id="rows"></div></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20260919-6"></script><script src="admin.js?v=20260919-6"></script>
</body></html>
